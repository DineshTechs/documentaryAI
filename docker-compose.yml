services:
  studio:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - studio-data:/data
    expose:
      - "8000"

  # Caddy gets a free HTTPS certificate for your domain automatically.
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - studio

volumes:
  studio-data:
  caddy-data:
  caddy-config:
